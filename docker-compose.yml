# Local dependencies only. The Go services run on your host with `make run-*`
# so you get fast rebuilds. Phase 2 moves everything into containers on k3s.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Catches all outbound mail in dev. Web UI on 8025, SMTP on 1025.
  # Replaced by SES in stage/prod — the app only knows SMTP settings.
  # mailpit rather than mailhog: native arm64, so no emulation on Apple Silicon.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
