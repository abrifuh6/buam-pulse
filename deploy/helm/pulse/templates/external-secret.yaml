{{- if .Values.externalSecrets.enabled }}
# Secrets Manager is the source of truth for credentials. The operator reads it
# with an IRSA role and writes an ordinary Kubernetes Secret that pods consume
# unchanged — so the same deployment manifests work locally with a plain Secret
# and in AWS with a managed one.
#
# The alternative, passing the database URL as a Helm value, puts the credential
# in the release history, in any CI log that renders the chart, and in the shell
# history of whoever ran the deploy.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pulse-aws
  labels: {{- include "pulse.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount }}
            namespace: {{ .Values.externalSecrets.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-secrets
  labels: {{- include "pulse.labels" . | nindent 4 }}
spec:
  # Re-read every hour. A rotated password propagates without a redeploy, though
  # pods still need a restart to pick up a changed environment variable — which
  # is why the checksum annotation on the deployments matters.
  refreshInterval: 1h
  secretStoreRef:
    name: pulse-aws
    kind: ClusterSecretStore
  target:
    # Same name the deployments already reference, so nothing downstream
    # changes between local and AWS.
    name: pulse-secrets
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "{{ `{{ .DATABASE_URL }}` }}"
        {{- range $key, $_ := .Values.externalSecrets.extra }}
        {{ $key }}: "{{ printf "{{ .%s }}" $key }}"
        {{- end }}
        # Redis needs no password: access is restricted by security group, and
        # the endpoint has no route to the internet.
        REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.databaseSecret }}
        property: url
    {{- range $key, $path := .Values.externalSecrets.extra }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $path.key }}
        property: {{ $path.property }}
    {{- end }}
{{- end }}
