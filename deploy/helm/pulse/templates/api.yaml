apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-api
  labels: {{- include "pulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: pulse-api } }
  template:
    metadata:
      labels: { app: pulse-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      containers:
        - name: api
          image: {{ .Values.image.prefix }}-api:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "pulse.env" . | nindent 12 }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
          ports: [{ containerPort: {{ .Values.api.port }}, name: http }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
spec:
  selector: { app: pulse-api }
  ports: [{ port: 80, targetPort: http, name: http }]
