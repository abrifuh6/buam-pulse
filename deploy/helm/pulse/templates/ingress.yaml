{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  labels: {{- include "pulse.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "alb" }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Listen on both ports. HTTP exists only to redirect to HTTPS — no traffic
    # is ever served in the clear.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Modern TLS only.
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: pulse
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Marketing site on the apex.
    - host: {{ .Values.ingress.siteHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: pulse-site, port: { name: http } }

    # Dashboard on its own host. /api goes to the API, everything else to the
    # SPA. No path prefix, because the host does the separating.
    - host: {{ .Values.ingress.appHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: pulse-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: pulse-web, port: { name: http } }

    # Status pages on their own host.
    - host: {{ .Values.ingress.statusHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: pulse-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: pulse-status, port: { name: http } }
{{- end }}
