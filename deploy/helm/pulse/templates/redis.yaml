{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-redis
  labels: {{- include "pulse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: pulse-redis } }
  template:
    metadata: { labels: { app: pulse-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-redis
spec:
  selector: { app: pulse-redis }
  ports: [{ port: 6379 }]
{{- end }}
