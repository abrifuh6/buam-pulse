{{- if not .Values.externalSecrets.enabled }}
# Plain Secret for local development. In AWS this is skipped entirely and
# ExternalSecret owns the same secret name instead — two resources claiming one
# name would fight, with the loser's values silently disappearing.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  labels: {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
