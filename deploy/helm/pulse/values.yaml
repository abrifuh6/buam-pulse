image:
  prefix: pulse
  tag: dev
  pullPolicy: IfNotPresent

api:
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

scheduler:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { memory: 64Mi }

worker:
  replicas: 2
  region: local
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

metricsPort: 9090

# In-cluster dependencies for dev. Disabled in stage/prod (RDS + ElastiCache).
postgres:
  enabled: false
  storage: 1Gi
redis:
  enabled: false

# When postgres.enabled=false, supply the external URL via secrets.
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
