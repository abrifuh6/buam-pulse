name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GO_VERSION: "1.26"          # must match go.mod and Dockerfile
  DOCKERHUB_NS: buamtech
  GHCR_NS: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---- 1. Fast checks: run on every PR and push --------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go test ./... -race -cover
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/pulse -f deploy/helm/pulse/values-dev.yaml

  # ---- 2. Build, scan, push: one job per service (matrix) ----------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to GHCR
      security-events: write   # lets Trivy upload findings to the Security tab
    strategy:
      fail-fast: false
      matrix:
        service: [api, scheduler, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: short git SHA always; "latest" on main; "vX.Y.Z" on release tags.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_NS }}/pulse-${{ matrix.service }}
            docker.io/${{ env.DOCKERHUB_NS }}/pulse-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Build once, load locally so Trivy can scan BEFORE anything is pushed.
      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: scan-target:${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy report (log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ matrix.service }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ matrix.service }}
          severity: CRITICAL,HIGH
          exit-code: "1"          # fail the build on unfixed critical/high CVEs
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

      # Only pushed if tests passed AND the scan found nothing serious.
      - name: Push to GHCR + Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
